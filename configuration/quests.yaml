quests:

  # =========================
  # DAILY
  # =========================

  - id: vitamins
    name: Take vitamins
    category: daily
    description: Take daily vitamins
    active: true

    xp:
      base: 5

      skills:
        vitality:
          base: 2

        discipline:
          base: 1


  - id: reading
    name: Reading
    category: daily
    description: Read a book
    active: true

    measurement:
      type: pages
      label: Pages
      unit: pages
      min: 1
      step: 1

    xp:
      base: 5

      scaling:
        per_unit: 1
        max_units: 50

      skills:
        intelligence:
          base: 1
          per_unit: 0.2

        discipline:
          base: 1


  - id: hobby
    name: Hobby for 1 hour
    category: daily
    description: Spend at least one hour on a hobby
    active: true

    xp:
      base: 20

      skills:
        creativity:
          base: 3

        discipline:
          base: 1


  - id: walk
    name: Go for a walk
    category: daily
    description: Go outside for a dedicated walk
    active: true

    xp:
      base: 10

      skills:
        vitality:
          base: 1

        endurance:
          base: 1

        discipline:
          base: 1


