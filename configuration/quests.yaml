    description: Complete a run
    active: true

    measurement:
      type: distance
      label: Distance
      unit: km
      min: 0.1
      step: 0.1

    xp:
      base: 10

      scaling:
        per_unit: 5
        max_units: 15

      skills:
        endurance:
          base: 2
