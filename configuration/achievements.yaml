achievements:

  # =========================
  # CORE HABITS
  # =========================

  - id: bookworm
    name: Bookworm
    description: Read every day for an entire week.
    icon: "▤"

    requirement_text:
      - Complete Reading on all 7 days.

    requirements:
      minimum_days_per_quest:
        reading: 7


  - id: pathfinder
    name: Pathfinder
    description: Get outside and walk every day for a full week.
    icon: "◇"

    requirement_text:
      - Complete Walking on all 7 days.

    requirements:
      minimum_days_per_quest:
        walk: 7


  - id: runners_week
    name: Runner's Week
    description: Build a serious running week.
    icon: "➤"

    requirement_text:
      - Complete Jogging on at least 4 different days.

    requirements:
      minimum_days_per_quest:
        jogging: 4


  # =========================
  # TRAINING
  # =========================

  - id: iron_week
    name: Iron Week
    description: Make strength training a major part of the week.
    icon: "⚒"

    requirement_text:
      - Complete Strength workouts on at least 4 different days.

    requirements:
      minimum_workout_type_days:
        strength: 4


  - id: cardio_week
    name: Cardio Week
    description: Maintain a demanding cardiovascular training schedule.
    icon: "▲"

    requirement_text:
      - Complete Cardio workouts on at least 4 different days.

    requirements:
      minimum_workout_type_days:
        cardio: 4


  - id: hybrid_athlete
    name: Hybrid Athlete
    description: Train strength and endurance seriously in the same week.
    icon: "⬢"

    requirement_text:
      - Complete Strength workouts on at least 3 different days.
      - Complete Cardio workouts on at least 3 different days.

    requirements:
      minimum_workout_type_days:
        strength: 3
        cardio: 3


  # =========================
  # ROUTINE
  # =========================

  - id: nutrition_lockin
    name: Nutrition Lock-In
    description: Maintain your nutrition routine every day for a full week.
    icon: "●"

    requirement_text:
      - Complete at least one Nutrition task on all 7 days.

    requirements:
      minimum_category_days:
        nutrition: 7


  - id: balanced
    name: Balanced
    description: Maintain your routine, nutrition and training throughout the week.
    icon: "◆"

    requirement_text:
      - Complete at least one Daily task on all 7 days.
      - Complete at least one Nutrition task on all 7 days.
      - Complete a Workout on at least 4 different days.

    requirements:
      minimum_category_days:
        daily: 7
        nutrition: 7
        workout: 4


  - id: relentless
    name: Relentless
    description: Keep an unbroken routine while maintaining a heavy training week.
    icon: "✦"

    requirement_text:
      - Complete at least one Daily task on all 7 days.
      - Complete a Workout on at least 5 different days.

    requirements:
      minimum_category_days:
        daily: 7
        workout: 5


  # =========================
  # TOP TIER
  # =========================

  - id: the_standard
    name: The Standard
    description: An exceptional week across routine, nutrition, learning and physical training.
    icon: "♛"

    requirement_text:
      - Complete Reading on all 7 days.
      - Complete at least one Daily task on all 7 days.
      - Complete at least one Nutrition task on all 7 days.
      - Complete Strength workouts on at least 3 different days.
      - Complete Cardio workouts on at least 2 different days.

    requirements:
      minimum_days_per_quest:
        reading: 7

      minimum_category_days:
        daily: 7
        nutrition: 7

      minimum_workout_type_days:
        strength: 3
        cardio: 2