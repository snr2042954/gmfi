<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        gmfi
        {% endblock %}
    </title>


    <link
        rel="icon"
        type="image/png"
        href="{{ url_for(
            'static',
            filename='gmfi-logo.png'
        ) }}"
    >


    <link
        rel="apple-touch-icon"
        href="{{ url_for(
            'static',
            filename='gmfi-touch-icon.png'
        ) }}"
    >


    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}"
    >

</head>


<body>

<main class="container">

    <header class="header">

        <div>

            <a
                href="{{ url_for('today_page') }}"
                class="brand"
                aria-label="gmfi home"
            >

                <img
                    src="{{ url_for(
                        'static',
                        filename='gmfi-logo.png'
                    ) }}"
                    alt="gmfi"
                    class="brand-logo"
                >

            </a>


            <div class="muted">
                {{ today }}
            </div>

        </div>


        <nav class="nav">

            <a
                href="{{ url_for('today_page') }}"
                class="{% if active_page == 'today' %}active{% endif %}"
            >
                Today
            </a>


            <a
                href="{{ url_for('character_page') }}"
                class="{% if active_page == 'character' %}active{% endif %}"
            >
                Character
            </a>


            <a
                href="{{ url_for('week_page') }}"
                class="{% if active_page == 'week' %}active{% endif %}"
            >
                Week
            </a>


            <a
                href="{{ url_for('trophies_page') }}"
                class="{% if active_page == 'trophies' %}active{% endif %}"
            >
                Trophies
            </a>


            <a
                href="{{ url_for('glossary_page') }}"
                class="{% if active_page == 'glossary' %}active{% endif %}"
            >
                Task Glossary
            </a>

        </nav>

    </header>


    {% block content %}
    {% endblock %}

</main>

</body>

</html>
